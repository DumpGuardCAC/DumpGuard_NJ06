name: android apk
on:
  workflow_dispatch:
    inputs:
      version:
        description: release tag, for example v1.2.0
        required: false
  push:
    branches: [main]
    paths: ['android/**', 'website/index.html', 'website/*.js', 'website/*.css', 'website/*.png', 'website/*.json', 'website/lib/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install && npm run sync
        working-directory: android
      - name: build apk
        env:
          DG_KEYSTORE_B64: ${{ secrets.DG_KEYSTORE_B64 }}
          DG_KEY_PASSWORD: ${{ secrets.DG_KEY_PASSWORD }}
        run: |
          echo "$DG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dumpguard.jks"
          export DG_KEYSTORE="$RUNNER_TEMP/dumpguard.jks"
          chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DumpGuard.apk
          gh release view --json body -q .body > notes.md 2>/dev/null || true
          [ -s notes.md ] || echo "Android install file. Download DumpGuard.apk on your phone and open it." > notes.md
          if [ -n "$VERSION" ]; then
            TAG="$VERSION"
          else
            LAST=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+$' | sort -t. -k1.2,1n -k2,2n | tail -1)
            if [ -z "$LAST" ]; then
              TAG="v1.1"
            else
              MAJOR=${LAST#v}; MAJOR=${MAJOR%%.*}
              MINOR=${LAST##*.}
              TAG="v${MAJOR}.$((MINOR + 1))"
            fi
          fi
          gh release create "$TAG" DumpGuard.apk --target "$GITHUB_SHA" --title "DumpGuard for Android" --notes-file notes.md --latest
